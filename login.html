<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS (optional) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 👇 ONLY THIS PART YOU REPLACE -->
<div class="container mt-5 col-md-4">
    <div class="card p-4 shadow">
        <h3 class="text-center">Login</h3>

        <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email">
        <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password">

        <button onclick="login()" class="btn btn-primary w-100">Login</button>
    </div>
</div>

<!-- JS LINK MUST BE PRESENT -->
<script src="script.js"></script>

</body>
</html>
