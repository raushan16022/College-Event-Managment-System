<!DOCTYPE html>
<html>
<head>
    <title>Add Event</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ✅ REPLACE BODY -->
<div class="container mt-5 col-md-5">
    <div class="card p-4 shadow">
        <h3>Add Event</h3>

        <input type="text" id="title" class="form-control mb-2" placeholder="Title">
        <input type="text" id="desc" class="form-control mb-2" placeholder="Description">
        <input type="date" id="date" class="form-control mb-2">
        <input type="text" id="venue" class="form-control mb-3" placeholder="Venue">

        <button onclick="addEvent()" class="btn btn-success w-100">Add Event</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
